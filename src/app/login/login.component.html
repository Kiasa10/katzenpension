<div>
  <h2>Dieser Bereich ist geschützt.</h2>
  <p>Passwort eingeben:</p>
  <input type="password" [(ngModel)]="password" (keyup.enter)="onLogin()" />
  <button (click)="onLogin()">Weiter</button>
  @if (errorMessage()) {
    <p>{{ errorMessage() }}</p>
  }
  @if (isLoading()) {
    <p>Der Server wird gestartet, bitte um etwas einen Moment Geduld...</p>
  }
</div>
