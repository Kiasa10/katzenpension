<div class="login-area">
  <h2>Dieser Bereich ist geschützt.</h2>
  <label for="pwInput">Passwort eingeben:</label>
  <input
    if="pwInput"
    type="password"
    [(ngModel)]="password"
    (keyup.enter)="onLogin()"
  />
  <button (click)="onLogin()">Weiter</button>
  @if (errorMessage()) {
    <p>{{ errorMessage() }}</p>
  }
  @if (isLoading()) {
    <p>Der Server wird gestartet, bitte um etwas einen Moment Geduld...</p>
  }
</div>
